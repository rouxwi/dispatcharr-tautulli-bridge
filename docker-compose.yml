services:
  dispatcharr-tautulli-bridge:
    image: ghcr.io/rouxwi/dispatcharr-tautulli-bridge:latest
    # or build it yourself from this folder instead:  build: .
    container_name: dispatcharr-tautulli-bridge
    restart: unless-stopped
    env_file: .env
    ports:
      - "8182:8182"
    volumes:
      - ./data:/data        # watch history + registered devices
    mem_limit: 256m
    cpus: 0.5
